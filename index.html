<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Bourse" />
<meta name="theme-color" content="#fffbeb" />
<title>Carnet de bourse</title>
<style>
  :root {
    --bg: #fffbeb;          /* amber-50  */
    --card: #ffffff;
    --border: #fde68a;      /* amber-200 */
    --border-soft: #fef3c7; /* amber-100 */
    --accent: #fcd34d;      /* amber-300 */
    --accent-strong: #fbbf24;/* amber-400 */
    --accent-ink: #b45309;  /* amber-700 */
    --ink: #1c1917;         /* stone-900 */
    --ink-soft: #78716c;    /* stone-500 */
    --ink-faint: #a8a29e;   /* stone-400 */
    --up: #047857; --up-bg: #ecfdf5; --up-border: #a7f3d0;
    --down: #b91c1c; --down-bg: #fef2f2; --down-border: #fecaca;
    --sheet: #fef3c7;
    font-family: 'Quicksand', ui-rounded, 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body { padding-bottom: env(safe-area-inset-bottom); }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 96px; }
  .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* Header */
  header { padding: 28px 0 18px; }
  .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent-ink); font-weight: 700; margin: 0; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; margin: 2px 0 0; }
  .gear { position: absolute; top: 26px; right: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; color: var(--accent-ink); }
  .head-row { position: relative; }

  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .card-sm { border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .card-sm.up { border-color: var(--up-border); background: var(--up-bg); }
  .card-sm.down { border-color: var(--down-border); background: var(--down-bg); }
  .card-sm .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); font-weight: 600; }
  .card-sm .val { font-size: 18px; font-weight: 600; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
  .card-sm.up .val { color: var(--up); }
  .card-sm.down .val { color: var(--down); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; background: var(--sheet); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
  .tabs button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 0; border: 0; border-radius: 9px; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-soft); background: transparent; cursor: pointer; }
  .tabs button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  /* Cards / forms */
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
  .field input, .field select { width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; font: inherit; font-size: 14px; color: var(--ink); background: var(--card); }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent-strong); box-shadow: 0 0 0 3px rgba(252,211,77,.4); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: 12px; color: var(--ink-soft); margin: 4px 0 0; }
  .hint .mono { font-weight: 600; color: var(--ink); }

  .btn { width: 100%; background: var(--accent); border: 1px solid var(--accent-strong); color: var(--ink); border-radius: 12px; padding: 12px; font: inherit; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .btn:active { background: var(--accent-strong); }
  .btn.ghost { background: var(--card); border-color: var(--border); font-weight: 600; }

  .msg { border-radius: 9px; padding: 9px 12px; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .msg.err { color: var(--down); background: var(--down-bg); border: 1px solid var(--down-border); }
  .msg.ok  { color: var(--up); background: var(--up-bg); border: 1px solid var(--up-border); display: flex; align-items: center; gap: 8px; }

  /* Portfolio */
  .group { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04); margin-bottom: 12px; }
  .group > .ghead { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: none; border: 0; text-align: left; font: inherit; cursor: pointer; }
  .ghead .name { font-weight: 700; }
  .ghead .name span { color: var(--ink-faint); font-weight: 500; font-size: 14px; }
  .ghead .sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .ghead .gain { font-weight: 700; font-size: 14px; }
  .gain.pos { color: var(--up); } .gain.neg { color: var(--down); }
  .lots { border-top: 1px solid var(--border-soft); padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .lot { background: var(--bg); border-radius: 12px; padding: 12px; }
  .lot-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-soft); }
  .buy-tag { color: var(--up); font-weight: 600; }
  .sell-tag { color: var(--down); font-weight: 600; }
  .del { background: none; border: 0; color: var(--ink-faint); cursor: pointer; padding: 2px; flex: 0 0 auto; }
  .del:active { color: var(--down); }
  .lot-meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--ink-soft); }
  .sales { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .sale { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-soft); }
  .empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 24px; }

  /* Settings sheet */
  .backdrop { position: fixed; inset: 0; background: rgba(28,25,23,.4); display: none; align-items: flex-end; z-index: 40; }
  .backdrop.open { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 680px; margin: 0 auto; border-radius: 18px 18px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; }
  .sheet h2 { font-size: 18px; margin: 0 0 4px; }
  .sheet .section-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); font-weight: 700; margin: 18px 0 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  svg { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head-row">
    <header>
      <p class="eyebrow">Carnet de bourse</p>
      <h1>Suivi des ordres</h1>
      <div class="summary" id="summary"></div>
    </header>
    <button class="gear" id="gearBtn" aria-label="Réglages" title="Réglages">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="achat">Achat</button>
    <button data-tab="vente">Vente</button>
    <button data-tab="portefeuille">Portefeuille</button>
  </div>

  <div id="view"></div>
</div>

<!-- Settings -->
<div class="backdrop" id="backdrop">
  <div class="sheet" id="sheet"></div>
</div>

<script>
"use strict";

/* ============ Config ============ */
const STORAGE_KEY = "positions";
const DEVISES = { EUR: { symbole: "€", label: "Euro (€)" }, USD: { symbole: "$", label: "Dollar ($)" } };

/* ============ State ============ */
const state = { positions: [], tab: "achat" };

/* ============ Persistence ============ */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.positions = JSON.parse(raw);
  } catch (e) { state.positions = []; }
}
function savePositions() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.positions)); } catch (e) {}
}

/* ============ Helpers ============ */
function fmtMoney(n, devise) {
  return new Intl.NumberFormat("fr-FR", { style: "currency", currency: devise || "EUR", currencyDisplay: "narrowSymbol" }).format(n || 0);
}
function fmtPct(n) { return (n >= 0 ? "+" : "") + n.toFixed(2) + " %"; }
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function num(v) { return parseFloat(String(v == null ? "" : v).replace(",", ".")); } // accepte la virgule décimale FR
function today() { return new Date().toISOString().slice(0, 10); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function coutUnitaire(p) { return p.prixAchat + (p.fraisAchat || 0) / p.quantite; }
function remaining(p) { return p.quantite - p.ventes.reduce((s, v) => s + v.quantite, 0); }
function groupKey(p) { return (p.ticker && p.ticker.trim().toUpperCase()) || p.nom.trim().toUpperCase(); }

/* ============ Icons (inline svg) ============ */
const I = {
  down:  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="8" x2="12" y2="16"/></svg>',
  up:    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="16 12 12 8 8 12"/><line x1="12" y1="16" x2="12" y2="8"/></svg>',
  check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  ok:    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  chevD: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
  chevU: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>',
  trUp:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
  trDown:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>',
};

/* ============ Mutations ============ */
function addPosition(p) {
  state.positions.unshift(Object.assign({ id: uid(), ventes: [] }, p));
  savePositions();
}
function addVente(positionId, vente) {
  const p = state.positions.find(x => x.id === positionId);
  if (p) { p.ventes.unshift(Object.assign({ id: uid() }, vente)); savePositions(); }
}
function deletePosition(id) {
  state.positions = state.positions.filter(p => p.id !== id);
  savePositions();
}

/* ============ Render : header ============ */
function renderSummary() {
  const byDev = {};
  for (const p of state.positions) {
    const d = p.devise || "EUR";
    if (!byDev[d]) byDev[d] = { investi: 0, realise: 0 };
    byDev[d].investi += remaining(p) * coutUnitaire(p);
    byDev[d].realise += p.ventes.reduce((s, v) => s + v.gain, 0);
  }
  const devs = Object.keys(byDev);
  const el = document.getElementById("summary");

  function card(lbl, val, positif, trend) {
    let cls = "card-sm", ic = "";
    if (trend) { cls += positif ? " up" : " down"; ic = positif ? I.trUp : I.trDown; }
    return '<div class="' + cls + '"><div class="lbl">' + esc(lbl) + '</div><div class="val mono">' + ic + val + '</div></div>';
  }

  if (!devs.length) {
    el.innerHTML =
      card("Investi (positions ouvertes)", fmtMoney(0, "EUR"), null) +
      card("Gain réalisé (net des ventes)", fmtMoney(0, "EUR"), true);
    return;
  }
  el.innerHTML = devs.map(d => {
    const t = byDev[d];
    return card("Investi (" + d + ")", fmtMoney(t.investi, d), null) +
           card("Gain réalisé (" + d + ")", fmtMoney(t.realise, d), t.realise >= 0, true);
  }).join("");
}

/* ============ Render : tabs + view ============ */
function renderTabs() {
  document.querySelectorAll("#tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === state.tab);
  });
}
function render() {
  renderSummary();
  renderTabs();
  const v = document.getElementById("view");
  if (state.tab === "achat") renderAchat(v);
  else if (state.tab === "vente") renderVente(v);
  else renderPortefeuille(v);
}

/* ============ Achat ============ */
function renderAchat(root) {
  root.innerHTML =
    '<div class="panel">' +
      field("Nom de l'action", "f_nom", "text", "ex. LVMH") +
      field("Ticker (optionnel)", "f_ticker", "text", "ex. MC.PA") +
      '<div class="grid2">' +
        field("Nombre d'actions", "f_qte", "decimal", "10") +
        selectDevise("f_dev") +
      '</div>' +
      '<div class="grid2">' +
        field("Prix d'achat unitaire", "f_prix", "decimal", "100.00", "px_sym") +
        field("Frais de l'ordre", "f_frais", "decimal", "0.00", "fr_sym") +
      '</div>' +
      field("Date d'achat", "f_date", "date", "") +
      '<p class="hint" id="totLine" style="display:none"></p>' +
      '<div id="amsg"></div>' +
      '<button class="btn" id="saveAchat">' + I.check + " Valider et enregistrer l'achat</button>" +
    "</div>";

  // 'dev' doit être défini AVANT tout appel à syncSym/updateTot (sinon ReferenceError)
  const dev = document.getElementById("f_dev");
  document.getElementById("f_date").value = today();

  function syncSym() {
    const s = DEVISES[dev.value].symbole;
    const a = document.getElementById("px_sym"), b = document.getElementById("fr_sym");
    if (a) a.textContent = " (" + s + ")";
    if (b) b.textContent = " (" + s + ")";
    updateTot();
  }
  function updateTot() {
    const q = num(val("f_qte")) || 0, px = num(val("f_prix")) || 0, fr = num(val("f_frais")) || 0;
    const tot = q * px + fr;
    const line = document.getElementById("totLine");
    if (tot > 0) {
      line.style.display = "";
      line.innerHTML = 'Montant total débité : <span class="mono">' + fmtMoney(tot, dev.value) + "</span> (actions + frais)";
    } else line.style.display = "none";
  }

  syncSym();
  dev.addEventListener("change", syncSym);
  ["f_qte", "f_prix", "f_frais"].forEach(id =>
    document.getElementById(id).addEventListener("input", updateTot));
  document.getElementById("saveAchat").addEventListener("click", submitAchat);
}

function submitAchat() {
  const box = document.getElementById("amsg");
  function err(m) { box.innerHTML = '<div class="msg err">' + esc(m) + "</div>"; }

  const nom = val("f_nom").trim(), ticker = val("f_ticker").trim();
  const qte = num(val("f_qte")), prix = num(val("f_prix")), frais = num(val("f_frais")) || 0;
  const dev = val("f_dev"), date = val("f_date");

  if (!nom) return err("Le nom de l'action est obligatoire.");
  if (!qte || qte <= 0) return err("Le nombre d'actions doit être un nombre positif.");
  if (!prix || prix <= 0) return err("Le prix d'achat doit être un nombre positif.");
  if (frais < 0) return err("Les frais ne peuvent pas être négatifs.");

  addPosition({ nom, ticker, quantite: qte, devise: dev, prixAchat: prix, fraisAchat: frais, dateAchat: date });
  render(); // re-rend le formulaire (vidé) + les totaux
  const nb = document.getElementById("amsg");
  if (nb) nb.innerHTML = '<div class="msg ok">' + I.ok + " Achat enregistré : " + esc(qte + " " + nom) + " à " + fmtMoney(prix, dev) + ".</div>";
}

/* ============ Vente ============ */
function renderVente(root) {
  const open = state.positions.filter(p => remaining(p) > 0);
  if (!open.length) {
    root.innerHTML = '<div class="panel"><p class="empty">Aucune position ouverte. Enregistre d\'abord un achat.</p></div>';
    return;
  }
  const opts = ['<option value="">Sélectionner une position…</option>'].concat(open.map(p =>
    '<option value="' + p.id + '">' + esc(p.nom + " — " + remaining(p) + " action(s), achetées à " +
      fmtMoney(p.prixAchat, p.devise || "EUR") + (p.fraisAchat ? " (+ frais)" : "") + " le " + p.dateAchat) + "</option>"
  )).join("");

  root.innerHTML =
    '<div class="panel">' +
      '<div class="field"><label>Action à vendre</label><select id="v_sel">' + opts + "</select></div>" +
      '<div id="v_body"></div>' +
      '<div id="vmsg"></div>' +
      '<button class="btn" id="saveVente">' + I.check + " Valider et calculer la vente</button>" +
    "</div>";

  const sel = document.getElementById("v_sel");
  sel.addEventListener("change", () => renderVenteBody(sel.value, open));
  document.getElementById("saveVente").addEventListener("click", () => submitVente(open));
}

function renderVenteBody(id, open) {
  const body = document.getElementById("v_body");
  document.getElementById("vmsg").innerHTML = "";
  const p = open.find(x => x.id === id);
  if (!p) { body.innerHTML = ""; return; }
  const dev = p.devise || "EUR", max = remaining(p), s = DEVISES[dev].symbole;
  body.innerHTML =
    '<p class="hint" style="margin:-4px 0 10px">Devise de cette ligne : <span class="mono">' + DEVISES[dev].label + "</span> (fixée par l'achat)</p>" +
    '<div class="grid2">' +
      field("Quantité vendue (max " + max + ")", "v_qte", "decimal", "5") +
      field("Prix de vente unitaire (" + s + ")", "v_prix", "decimal", "110.00") +
    "</div>" +
    '<div class="grid2">' +
      field("Frais de l'ordre (" + s + ")", "v_frais", "decimal", "0.00") +
      field("Date de vente", "v_date", "date", "") +
    "</div>";
  document.getElementById("v_date").value = today();
}

function submitVente(open) {
  const box = document.getElementById("vmsg");
  function err(m) { box.innerHTML = '<div class="msg err">' + esc(m) + "</div>"; }

  const id = val("v_sel");
  const p = open.find(x => x.id === id);
  if (!p) return err("Choisis une position à vendre.");
  const max = remaining(p), dev = p.devise || "EUR";
  const q = num(val("v_qte")), pv = num(val("v_prix")), fv = num(val("v_frais")) || 0;

  if (!q || q <= 0) return err("Le nombre d'actions vendues doit être positif.");
  if (q > max) return err("Tu ne possèdes que " + max + " action(s) disponible(s) sur cette ligne.");
  if (!pv || pv <= 0) return err("Le prix de vente doit être positif.");
  if (fv < 0) return err("Les frais ne peuvent pas être négatifs.");

  const coutU = coutUnitaire(p);
  const gain = (pv - coutU) * q - fv;
  const rendementPct = (gain / (coutU * q)) * 100;
  addVente(p.id, { quantite: q, prixVente: pv, fraisVente: fv, date: val("v_date"), gain, rendementPct });
  render();
  const nb = document.getElementById("vmsg");
  if (nb) nb.innerHTML = '<div class="msg ok">' + I.ok + " Vente enregistrée : " + esc(q + " " + p.nom) +
    " — gain de " + fmtMoney(gain, dev) + " (" + fmtPct(rendementPct) + ").</div>";
}

/* ============ Portefeuille ============ */
const openGroups = {};
function renderPortefeuille(root) {
  if (!state.positions.length) {
    root.innerHTML = '<div class="panel"><p class="empty">Ton portefeuille est vide. Enregistre un premier achat pour commencer.</p></div>';
    return;
  }
  const groups = {};
  for (const p of state.positions) {
    const k = groupKey(p);
    if (!groups[k]) groups[k] = { nom: p.nom, ticker: p.ticker, lots: [] };
    groups[k].lots.push(p);
  }

  root.innerHTML = Object.keys(groups).map(k => {
    const g = groups[k];
    const dev = g.lots[0].devise || "EUR";
    const totalAch = g.lots.reduce((s, p) => s + p.quantite, 0);
    const totalRest = g.lots.reduce((s, p) => s + remaining(p), 0);
    const valRest = g.lots.reduce((s, p) => s + remaining(p) * coutUnitaire(p), 0);
    const gain = g.lots.reduce((s, p) => s + p.ventes.reduce((sv, v) => sv + v.gain, 0), 0);
    const nbV = g.lots.reduce((s, p) => s + p.ventes.length, 0);
    const isOpen = openGroups[k] !== false;

    const lots = g.lots.map(p => {
      const rest = remaining(p), gLot = p.ventes.reduce((s, v) => s + v.gain, 0), d = p.devise || "EUR";
      const sales = p.ventes.length ? '<div class="sales">' + p.ventes.map(v =>
        '<div class="sale"><span>' + I.up + " " + esc(v.date + " — " + v.quantite + " vendue(s) à ") + fmtMoney(v.prixVente, d) +
        (v.fraisVente ? esc(" (frais ") + fmtMoney(v.fraisVente, d) + ")" : "") + '</span><span class="mono ' +
        (v.gain >= 0 ? "gain pos" : "gain neg") + '">' + fmtMoney(v.gain, d) + " (" + fmtPct(v.rendementPct) + ")</span></div>"
      ).join("") + "</div>" : "";

      return '<div class="lot">' +
        '<div class="lot-top"><div><span class="buy-tag">' + I.down + " Achat du " + esc(p.dateAchat) + "</span> — " +
          esc(p.quantite + " action(s) à ") + fmtMoney(p.prixAchat, d) +
          (p.fraisAchat ? " + " + fmtMoney(p.fraisAchat, d) + " de frais" : "") + "</div>" +
          '<button class="del" data-del="' + p.id + '" aria-label="Supprimer">' + I.trash + "</button></div>" +
        '<div class="lot-meta"><span>Restant : <span class="mono">' + rest + '</span> pour <span class="mono">' + fmtMoney(rest * coutUnitaire(p), d) + "</span></span>" +
          (p.ventes.length ? '<span class="mono ' + (gLot >= 0 ? "gain pos" : "gain neg") + '">Réalisé : ' + fmtMoney(gLot, d) + "</span>" : "") +
        "</div>" + sales + "</div>";
    }).join("");

    return '<div class="group">' +
      '<button class="ghead" data-grp="' + esc(k) + '">' +
        '<div><div class="name">' + esc(g.nom) + (g.ticker ? ' <span>(' + esc(g.ticker) + ")</span>" : "") + "</div>" +
        '<div class="sub">Reste <span class="mono">' + totalRest + "</span> / " + totalAch + ' action(s) — valeur <span class="mono">' + fmtMoney(valRest, dev) + "</span></div></div>" +
        '<div style="display:flex;align-items:center;gap:12px">' +
          (nbV ? '<span class="mono gain ' + (gain >= 0 ? "pos" : "neg") + '">' + fmtMoney(gain, dev) + "</span>" : "") +
          (isOpen ? I.chevU : I.chevD) + "</div>" +
      "</button>" +
      (isOpen ? '<div class="lots">' + lots + "</div>" : "") +
    "</div>";
  }).join("");

  root.querySelectorAll("[data-grp]").forEach(b =>
    b.addEventListener("click", () => { const k = b.dataset.grp; openGroups[k] = openGroups[k] === false ? true : false; renderPortefeuille(root); }));
  root.querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", () => {
      if (confirm("Supprimer cet achat et son historique de ventes ?")) { deletePosition(b.dataset.del); render(); }
    }));
}

/* ============ Settings sheet ============ */
function openSettings() {
  const sheet = document.getElementById("sheet");
  sheet.innerHTML =
    "<h2>Réglages</h2>" +
    '<p class="hint">Tout est stocké localement sur ce téléphone.</p>' +

    '<div class="section-lbl">Sauvegarde des données</div>' +
    '<div class="row2">' +
      '<button class="btn ghost" id="exportBtn">Exporter (JSON)</button>' +
      '<button class="btn ghost" id="importBtn">Importer (JSON)</button>' +
    "</div>" +
    '<input type="file" accept="application/json,.json" id="importFile" style="display:none" />' +
    '<p class="hint">Exporte régulièrement : le navigateur peut purger le stockage local si l\'app n\'est pas ouverte pendant plusieurs jours.</p>' +

    '<div class="section-lbl">Fermer</div>' +
    '<button class="btn ghost" id="closeSheet">Fermer les réglages</button>';

  document.getElementById("exportBtn").addEventListener("click", exportJSON);
  document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change", importJSON);
  document.getElementById("closeSheet").addEventListener("click", closeSettings);

  document.getElementById("backdrop").classList.add("open");
}
function closeSettings() { document.getElementById("backdrop").classList.remove("open"); }

function exportJSON() {
  const blob = new Blob([JSON.stringify(state.positions, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "carnet-bourse-" + today() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importJSON(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) throw new Error("format");
      const ok = data.every(p => p && typeof p.nom === "string" && typeof p.quantite === "number" && Array.isArray(p.ventes));
      if (!ok) throw new Error("champs");
      if (confirm("Remplacer les " + state.positions.length + " ligne(s) actuelle(s) par les " + data.length + " ligne(s) du fichier ?")) {
        state.positions = data.map(p => Object.assign({ id: p.id || uid(), ventes: p.ventes || [] }, p));
        savePositions();
        closeSettings();
        render();
      }
    } catch (err) {
      alert("Fichier invalide : ce n'est pas un export de carnet de bourse.");
    }
    e.target.value = "";
  };
  r.readAsText(file);
}

/* ============ UI builders ============ */
function field(label, id, type, ph, symSpanId) {
  const it = type === "decimal" ? "text" : type;
  const inputmode = type === "decimal" ? ' inputmode="decimal"' : "";
  const symSpan = symSpanId ? '<span id="' + symSpanId + '"></span>' : "";
  return '<div class="field"><label>' + esc(label) + symSpan + '</label>' +
    '<input id="' + id + '" type="' + it + '"' + inputmode + ' placeholder="' + esc(ph) + '" /></div>';
}
function selectDevise(id) {
  const opts = Object.keys(DEVISES).map(c => '<option value="' + c + '">' + esc(DEVISES[c].label) + "</option>").join("");
  return '<div class="field"><label>Devise</label><select id="' + id + '">' + opts + "</select></div>";
}
function val(id) { const e = document.getElementById(id); return e ? e.value : ""; }

/* ============ Boot ============ */
loadState();
document.querySelectorAll("#tabs button").forEach(b =>
  b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); }));
document.getElementById("gearBtn").addEventListener("click", openSettings);
document.getElementById("backdrop").addEventListener("click", e => { if (e.target.id === "backdrop") closeSettings(); });
render();
</script>
</body>
</html>
